name: Keep Server Awake

on:
  schedule:
    # Runs every 14 minutes to prevent the 15-minute idle spin-down
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Wake Endpoint
        # IMPORTANT: Replace the URL below with your actual production URL
        run: |
          echo "Pinging server..."
          curl -sSf -o /dev/null -w "HTTP Status: %{http_code}\n" https://my-vesper.onrender.com/wake
